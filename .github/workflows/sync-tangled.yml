name: sync-main-to-tangled

on:
  push:
    branches: [main, gitops]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-${{ github.ref_name }}-to-tangled
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.TANGLED_SSH_PRIVATE_KEY }}

      - name: Trust Tangled host key
        run: ssh-keyscan tangled.org >> ~/.ssh/known_hosts

      - name: Push branch to Tangled
        run: |
          git remote add tangled git@tangled.org:heywoodlh.io/nixos-configs
          git push --force tangled "HEAD:refs/heads/${GITHUB_REF_NAME}"
