---
- name: Install Nix installer prerequisites on Debian systems
  ansible.builtin.package:
    name:
      - coreutils
      - curl
      - dbus
      - git
      - xz-utils
  when: ansible_os_family == "Debian"

- name: Install Nix installer prerequisites on other systems
  ansible.builtin.package:
    name:
      - coreutils
      - curl
      - dbus
      - git
      - xz
  when: ansible_os_family != "Debian"

- name: Install Alpine Home Manager DBus prerequisites
  ansible.builtin.package:
    name:
      - dbus
      - dconf
      - gnome-shell
      - gsettings-desktop-schemas
  when: ansible_os_family == "Alpine"

- name: Create Alpine DBus runtime directory
  ansible.builtin.file:
    path: /tmp/xdg-runtime-heywoodlh
    state: directory
    owner: heywoodlh
    group: heywoodlh
    mode: "0700"
  when: ansible_os_family == "Alpine"

- name: Check if Nix store exists
  ansible.builtin.stat:
    path: /nix
  register: nix_store_check

- name: Download Nix installer
  ansible.builtin.get_url:
    url: https://nixos.org/nix/install
    dest: /tmp/nix-install.sh
    mode: "0755"
  when: not nix_store_check.stat.exists

- name: Install Nix with the multi-user installer
  ansible.builtin.command:
    argv:
      - /bin/sh
      - /tmp/nix-install.sh
      - --daemon
      - --yes
  when:
    - not nix_store_check.stat.exists
    - ansible_os_family != "Alpine"

- name: Create Alpine Ansible temporary directory
  ansible.builtin.file:
    path: /tmp/ansible-heywoodlh
    state: directory
    owner: heywoodlh
    group: heywoodlh
    mode: "0700"
  when:
    - not nix_store_check.stat.exists
    - ansible_os_family == "Alpine"

- name: Install Nix with the single-user installer on Alpine
  when:
    - not nix_store_check.stat.exists
    - ansible_os_family == "Alpine"
  block:
    - name: Allow Nix installer to create /nix
      ansible.builtin.copy:
        content: "heywoodlh ALL=(ALL) NOPASSWD: ALL\n"
        dest: /etc/sudoers.d/nix-installer-heywoodlh
        mode: "0440"

    - name: Run Nix single-user installer
      ansible.builtin.command:
        argv:
          - /bin/sh
          - /tmp/nix-install.sh
          - --no-daemon
          - --yes
      become: true
      become_user: heywoodlh
      vars:
        ansible_remote_tmp: /tmp/ansible-heywoodlh

  always:
    - name: Remove Nix installer sudo rule
      ansible.builtin.file:
        path: /etc/sudoers.d/nix-installer-heywoodlh
        state: absent

- name: Set Nix binary path
  ansible.builtin.set_fact:
    nix_binary_path: "{{ '/home/heywoodlh/.nix-profile/bin/nix' if ansible_os_family == 'Alpine' else '/nix/var/nix/profiles/default/bin/nix' }}"

- name: Create Nix configuration directory
  ansible.builtin.file:
    path: /etc/nix
    state: directory
    mode: "0755"

- name: Add Nix to login PATH
  ansible.builtin.copy:
    dest: /etc/profile.d/nix-path.sh
    content: PATH=$PATH:/nix/var/nix/profiles/default/bin
    mode: "0644"
  when: ansible_os_family != "Alpine"

- name: Check Tailscale cache availability
  ansible.builtin.uri:
    url: http://attic.barn-banana.ts.net
  register: tailscale_server_check
  ignore_errors: true

- name: Configure Nix with Tailscale cache
  ansible.builtin.copy:
    src: etc/nix/nix.tailscale.conf
    dest: /etc/nix/nix.conf
    mode: "0644"
  when: tailscale_server_check.status == 200
  register: nix_config

- name: Configure Nix without Tailscale cache
  ansible.builtin.copy:
    src: etc/nix/nix.conf
    dest: /etc/nix/nix.conf
    mode: "0644"
  when: tailscale_server_check.status != 200
  register: nix_config

- name: Enable Nix flakes and nix-command
  ansible.builtin.lineinfile:
    path: /etc/nix/nix.conf
    regexp: ^experimental-features =
    line: experimental-features = nix-command flakes pipe-operators

- name: Restart Nix daemon
  ansible.builtin.service:
    name: nix-daemon
    enabled: true
    state: restarted
  when:
    - ansible_os_family != "Alpine"
    - nix_config.changed
