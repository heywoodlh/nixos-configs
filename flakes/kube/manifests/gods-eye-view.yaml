---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gods-eye-view
  namespace: "default"
  labels:
    app.kubernetes.io/name: gods-eye-view
    app.kubernetes.io/instance: gods-eye-view
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gods-eye-view
      app.kubernetes.io/instance: gods-eye-view
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gods-eye-view
        app.kubernetes.io/instance: gods-eye-view
    spec:
      initContainers:
        - name: source
          image: "docker.io/node:24.14.0-bookworm@sha256:5a593d74b632d1c6f816457477b6819760e13624455d587eef0fa418c8d0777b"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              apt-get update
              apt-get install --yes --no-install-recommends git ca-certificates
              git init /workspace
              git config --global --add safe.directory /workspace
              cd /workspace
              if git remote get-url origin >/dev/null 2>&1; then
                git remote set-url origin https://github.com/bilawalsidhu/gods-eye-view.git
              else
                git remote add origin https://github.com/bilawalsidhu/gods-eye-view.git
              fi
              git fetch --depth 1 origin 9beadbda6333b83f79aa03047e2d851830f01f6b
              git checkout --detach -f FETCH_HEAD
              npm ci --cache /tmp/npm-cache
              chown -R 1000:1000 /workspace
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /workspace
      containers:
        - name: gods-eye-view
          image: "docker.io/node:24.14.0-bookworm@sha256:5a593d74b632d1c6f816457477b6819760e13624455d587eef0fa418c8d0777b"
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command:
            - /bin/sh
            - -ec
            - |
              exec npm run dev -- --host 0.0.0.0
          env:
            - name: PORT
              value: "5173"
            - name: GEV_ALLOWED_HOSTS
              value: "gods-eye-view,gods-eye-view.barn-banana.ts.net,gods-eye-view.default.svc.cluster.local,gods-eye.heywoodlh.io"
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: data
              mountPath: /workspace
            - name: logs
              mountPath: /logs
              readOnly: true
      volumes:
        - name: data
          hostPath:
            path: "/media/data-ssd/gods-eye"
            type: DirectoryOrCreate
        - name: logs
          hostPath:
            path: /logs
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: gods-eye-view
  namespace: "default"
  labels:
    app.kubernetes.io/name: gods-eye-view
    app.kubernetes.io/instance: gods-eye-view
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "gods-eye-view"
    tailscale.com/tags: "tag:http"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: gods-eye-view
    app.kubernetes.io/instance: gods-eye-view