apiVersion: v1
kind: ConfigMap
metadata:
  name: kiwix-zim-downloader
  namespace: default
data:
  download.sh: |
    #!/bin/sh
    umask 022
    urls_file="${ZIM_URLS_FILE:-/config/zims.txt}"
    dest_root="${ZIM_DEST:-/kiwix}"
    failed=0

    remote_size() {
      curl -fsSIL --retry 3 --connect-timeout 30 "$1" | tr -d '\r' | awk 'tolower($1) == "content-length:" { size = $2 } END { print size }'
    }

    is_dated_zim() {
      case "$1" in
        [0-9][0-9][0-9][0-9]-[0-9][0-9].zim | [0-9][0-9][0-9][0-9]-[0-9][0-9][a-z].zim) return 0 ;;
        *) return 1 ;;
      esac
    }

    prune_superseded() {
      dir="$1"
      name="$2"
      stem="${name%_*}"
      for old in "${dir}/${stem}_"*.zim; do
        [ -e "${old}" ] || continue
        [ "${old}" = "${dir}/${name}" ] && continue
        suffix="${old##*/}"
        suffix="${suffix#"${stem}"_}"
        if is_dated_zim "${suffix}"; then
          echo "Removing superseded ${old}"
          rm -f "${old}"
        fi
      done
    }

    while read -r category url _; do
      case "${category}" in
        "" | "#"*) continue ;;
      esac
      [ -n "${url}" ] || continue

      name="${url##*/}"
      dir="${dest_root}/${category}"
      dest="${dir}/${name}"
      part="${dest}.part"
      mkdir -p "${dir}"

      size="$(remote_size "${url}")"
      if [ -z "${size}" ]; then
        echo "ERROR: could not determine size of ${url}"
        failed=$((failed + 1))
        continue
      fi

      if [ -f "${dest}" ] && [ "$(wc -c < "${dest}")" = "${size}" ]; then
        echo "Up to date: ${category}/${name}"
        prune_superseded "${dir}" "${name}"
        continue
      fi

      if [ -f "${part}" ] && [ "$(wc -c < "${part}")" -gt "${size}" ]; then
        rm -f "${part}"
      fi

      echo "Downloading ${category}/${name} (${size} bytes)"
      if curl -fL --no-progress-meter --show-error --retry 5 --retry-delay 15 --connect-timeout 30 --speed-limit 1024 --speed-time 120 -C - -o "${part}" "${url}" \
        && [ "$(wc -c < "${part}")" = "${size}" ]; then
        mv -f "${part}" "${dest}"
        prune_superseded "${dir}" "${name}"
      else
        echo "ERROR: failed to download ${url}"
        failed=$((failed + 1))
      fi
    done < "${urls_file}"

    if [ "${failed}" -gt 0 ]; then
      echo "${failed} download(s) failed"
      exit 1
    fi
    echo "All ZIM files are up to date"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kiwix-zim-downloader
  namespace: default
spec:
  schedule: "0 3 * * 0"
  timeZone: "America/Denver"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 172800
      template:
        metadata:
          labels:
            app: kiwix-zim-downloader
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: homelab
          containers:
          - name: downloader
            image: docker.io/curlimages/curl:8.23.0
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh", "/scripts/download.sh"]
            env:
            - name: ZIM_URLS_FILE
              value: /config/zims.txt
            - name: ZIM_DEST
              value: /kiwix
            securityContext:
              runAsUser: 0
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
            - name: urls
              mountPath: /config
              readOnly: true
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: kiwix
              mountPath: /kiwix
          volumes:
          - name: urls
            configMap:
              name: kiwix-zim-urls
          - name: script
            configMap:
              name: kiwix-zim-downloader
          - name: kiwix
            hostPath:
              path: /media/services_pool/kiwix
              type: DirectoryOrCreate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiwix-apk-sources
  namespace: default
data:
  apks.txt: |
    kiwix-android.apk github kiwix/kiwix-android /v[0-9.]*-arm64-v8a-standalone\.apk$
    meshtastic.apk github meshtastic/Meshtastic-Android /androidApp-fdroid-arm64-v8a-release\.apk$
    cromite.apk github uazo/cromite /arm64_ChromePublic\.apk$
    briar.apk url https://briarproject.org/apk/briar.apk
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiwix-apk-downloader
  namespace: default
data:
  download-apks.sh: |
    #!/bin/sh
    umask 022
    sources_file="${APK_SOURCES_FILE:-/config/apks.txt}"
    dest_dir="${APK_DEST:-/kiwix/android}"
    failed=0

    mkdir -p "${dest_dir}"

    head_value() {
      curl -fsSIL --retry 3 --connect-timeout 30 "$1" | tr -d '\r' | awk -v key="$2" 'tolower($1) == key ":" { $1 = ""; value = $0 } END { print value }'
    }

    latest_github_asset() {
      repo="$1"
      pattern="$2"
      release="$(curl -fsSL --retry 3 --connect-timeout 30 "https://api.github.com/repos/${repo}/releases/latest")" || return 1
      tag="$(printf '%s\n' "${release}" | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4)"
      asset_url="$(printf '%s\n' "${release}" | grep -o '"browser_download_url": *"[^"]*"' | cut -d'"' -f4 | grep -E "${pattern}" | head -1)"
      [ -n "${tag}" ] && [ -n "${asset_url}" ] || return 1
      printf '%s %s\n' "${tag}" "${asset_url}"
    }

    while read -r name kind source pattern; do
      case "${name}" in
        "" | "#"*) continue ;;
      esac

      dest="${dest_dir}/${name}"
      stamp="${dest_dir}/.${name}.stamp"
      part="${dest}.part"

      case "${kind}" in
        github)
          if ! found="$(latest_github_asset "${source}" "${pattern}")"; then
            echo "ERROR: no matching release asset for ${source}"
            failed=$((failed + 1))
            continue
          fi
          tag="${found%% *}"
          url="${found#* }"
          version="${tag}"
          ;;
        url)
          url="${source}"
          version="$(head_value "${url}" etag)$(head_value "${url}" last-modified)"
          ;;
        *)
          echo "ERROR: unknown source kind ${kind} for ${name}"
          failed=$((failed + 1))
          continue
          ;;
      esac

      size="$(head_value "${url}" content-length | tr -d ' ')"
      if [ -z "${size}" ]; then
        echo "ERROR: could not determine size of ${url}"
        failed=$((failed + 1))
        continue
      fi

      current="${version} ${size}"
      if [ -f "${dest}" ] && [ "$(cat "${stamp}" 2>/dev/null)" = "${current}" ] && [ "$(wc -c < "${dest}")" = "${size}" ]; then
        echo "Up to date: ${name} (${version})"
        continue
      fi

      echo "Downloading ${name} (${version}, ${size} bytes)"
      rm -f "${part}"
      if curl -fL --no-progress-meter --show-error --retry 5 --retry-delay 15 --connect-timeout 30 --speed-limit 1024 --speed-time 120 -o "${part}" "${url}" \
        && [ "$(wc -c < "${part}")" = "${size}" ]; then
        mv -f "${part}" "${dest}"
        printf '%s\n' "${current}" > "${stamp}"
      else
        rm -f "${part}"
        echo "ERROR: failed to download ${url}"
        failed=$((failed + 1))
      fi
    done < "${sources_file}"

    if [ "${failed}" -gt 0 ]; then
      echo "${failed} download(s) failed"
      exit 1
    fi
    echo "All APKs are up to date"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kiwix-apk-downloader
  namespace: default
spec:
  schedule: "30 2 * * 0"
  timeZone: "America/Denver"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
