---
apiVersion: v1
kind: Service
metadata:
  name: lmstudio
  namespace: machine-learning
  labels:
    app.kubernetes.io/name: lmstudio
    app.kubernetes.io/instance: lmstudio
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "llm"
    tailscale.com/tags: "tag:http"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: lmstudio
      protocol: TCP
      name: lmstudio
  selector:
    app.kubernetes.io/name: lmstudio
    app.kubernetes.io/instance: lmstudio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lmstudio
  namespace: machine-learning
  labels:
    app.kubernetes.io/name: lmstudio
    app.kubernetes.io/instance: lmstudio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lmstudio
      app.kubernetes.io/instance: lmstudio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lmstudio
        app.kubernetes.io/instance: lmstudio
    spec:
      containers:
        - name: lmstudio
          image: "docker.io/linuxserver/lm-studio@sha256:3183a63d7ef121426a9f8dd908f095626aaa7f6fcf4e941d232c02bfbf4c58d7"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              export HOME=/config
              lms daemon up
              lms get --yes --gguf "google/gemma-4-e4b"
              lms load "google/gemma-4-e4b" --identifier "google/gemma-4-e4b" --context-length 32768 --gpu 1 --yes
              lms server start --port 1234 --bind 0.0.0.0
              exec tail -f /dev/null
          env:
            - name: AUTO_GPU
              value: "true"
          ports:
            - name: lmstudio
              containerPort: 1234
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: "1000m"
              memory: "12Gi"
              gpu.intel.com/i915: "1"
            limits:
              cpu: "8"
              memory: "32Gi"
              gpu.intel.com/i915: "1"
          startupProbe:
            httpGet:
              path: /v1/models
              port: lmstudio
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /v1/models
              port: lmstudio
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/models
              port: lmstudio
            periodSeconds: 30
      volumes:
        - name: config
          hostPath:
            path: /media/data-ssd/lmstudio
            type: DirectoryOrCreate
