  mirror-apk.sh: |
    #!/bin/sh
    set -u
    umask 022

    dest="${MIRROR_DEST:-/mirror}"
    arch="$(apk --print-arch)"
    repo="${dest}/${arch}"
    keys="${dest}/keys"
    packages="${APK_PACKAGES:-firefox gnome-terminal ghostty meshtasticd kiwix-desktop python3 py3-pip python3-dev go gcc g++ build-base musl-dev gdb make vim helix msedit socat}"
    failed=0

    apk add --no-cache abuild openssl > /dev/null || exit 1
    mkdir -p "${repo}" "${keys}"
    ln -sfn "${arch}" "${dest}/noarch"

    if [ ! -f "${keys}/nomad.rsa" ]; then
      openssl genrsa -out "${keys}/nomad.rsa" 4096 2> /dev/null || exit 1
      openssl rsa -in "${keys}/nomad.rsa" -pubout -out "${keys}/nomad.rsa.pub" 2> /dev/null || exit 1
    fi
    cp "${keys}/nomad.rsa.pub" "${dest}/nomad.rsa.pub"

    : > /tmp/status
    available=""
    for package in ${packages}; do
      if apk search -x "${package}" | grep -q .; then
        available="${available} ${package}"
        echo "included ${package}" >> /tmp/status
      else
        echo "ERROR: ${package} is not packaged in Alpine $(cat /etc/alpine-release)"
        echo "missing ${package}" >> /tmp/status
        failed=$((failed + 1))
      fi
    done

    # shellcheck disable=SC2086
    apk fetch --recursive --simulate ${available} 2>&1 | sed -n 's/^Downloading //p' > /tmp/wanted
    if [ ! -s /tmp/wanted ]; then
      echo "ERROR: dependency resolution produced no packages"
      exit 1
    fi
    sed 's/$/.apk/' /tmp/wanted | sort -u > /tmp/wanted.apk

    # shellcheck disable=SC2086
    apk fetch --recursive --output "${repo}" ${available} || failed=$((failed + 1))

    for apk_file in "${repo}"/*.apk; do
      [ -e "${apk_file}" ] || continue
      grep -qxF "${apk_file##*/}" /tmp/wanted.apk || { echo "Removing superseded ${apk_file##*/}"; rm -f "${apk_file}"; }
    done

    rm -f "${repo}/APKINDEX.tar.gz"
    apk index --output "${repo}/APKINDEX.tar.gz" "${repo}"/*.apk || exit 1
    abuild-sign -k "${keys}/nomad.rsa" "${repo}/APKINDEX.tar.gz" || exit 1

    {
      echo "Alpine $(cat /etc/alpine-release) package mirror, rebuilt $(date -u +%FT%TZ)"
      echo
      echo "Trust the signing key and add the repository:"
      echo "  wget -O /etc/apk/keys/nomad.rsa.pub http://<nomad-host>/files/linux/apk/nomad.rsa.pub"
      echo "  echo http://<nomad-host>/files/linux/apk >> /etc/apk/repositories"
      echo
      sort /tmp/status
    } > "${dest}/README.txt"

    echo "Mirror contains $(ls "${repo}"/*.apk | wc -l) packages"
    [ "${failed}" -eq 0 ]
  mirror-debs.sh: |
    #!/bin/sh
    set -u
    umask 022
    . /etc/nomad/lib.sh

    dest="${MIRROR_DEST:-/mirror}"
    pool="${dest}/pool"
    extra="${dest}/extra"
    work="${dest}/.work"
    packages="${DEB_PACKAGES:-firefox gnome-terminal meshtasticd kiwix python3 python3-pip python3-venv python3-dev golang-go gcc g++ build-essential gdb make vim socat}"
    failed=0

    export DEBIAN_FRONTEND=noninteractive

    apt-get update -qq || exit 1
    apt-get install -y -qq --no-install-recommends ca-certificates curl gnupg apt-utils software-properties-common > /dev/null || exit 1

    install -d -m 0755 /etc/apt/keyrings
    curl -fsSL https://packages.mozilla.org/apt/repo-signing-key.gpg -o /etc/apt/keyrings/packages.mozilla.org.asc || exit 1
    echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" > /etc/apt/sources.list.d/mozilla.list
    printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' > /etc/apt/preferences.d/mozilla
    add-apt-repository -y ppa:meshtastic/beta > /dev/null || exit 1
    apt-get update -qq || exit 1

    rm -rf "${work}"
    mkdir -p "${pool}" "${extra}" "${work}/dl"
    : > "${work}/keep"
    : > "${work}/need"
    : > "${work}/status"

    key_of() {
      base="${1##*/}"
      printf '%s\n' "${base%_*}"
    }

    local_debs=""
    local_names=""
    fetch_deb() {
      url="$(gh_asset_url "$1" "$2")"
      if [ -z "${url}" ]; then
        echo "ERROR: no release asset for $1"
        echo "missing $1" >> "${work}/status"
        failed=$((failed + 1))
        return
      fi
      file="${pool}/${url##*/}"
      if [ ! -s "${file}" ] && ! download "${url}" "${file}"; then
        echo "ERROR: failed to download ${url}"
        failed=$((failed + 1))
        return
      fi
      local_debs="${local_debs} ${file}"
      local_names="${local_names} $(dpkg-deb -f "${file}" Package)"
      key_of "${file}" >> "${work}/keep"
      echo "upstream ${url##*/}" >> "${work}/status"
    }

    fetch_deb mkasberg/ghostty-ubuntu 'ghostty_.*_amd64_24\.04\.deb$'
    fetch_deb helix-editor/helix 'helix_.*_amd64\.deb$'

    msedit_url="$(gh_asset_url microsoft/edit 'edit-.*-x86_64-linux-gnu\.tar\.gz$')"
    if [ -n "${msedit_url}" ]; then
      msedit_file="${extra}/${msedit_url##*/}"
      if [ -s "${msedit_file}" ] || download "${msedit_url}" "${msedit_file}"; then
        for old in "${extra}"/edit-*-x86_64-linux-gnu.tar.gz; do
          [ "${old}" != "${msedit_file}" ] && rm -f "${old}"
        done
        echo "upstream extra/${msedit_file##*/}" >> "${work}/status"
      else
        failed=$((failed + 1))
      fi
    else
      echo "ERROR: no release asset for microsoft/edit"
      failed=$((failed + 1))
    fi

    available=""
    for package in ${packages}; do
      if apt-cache show "${package}" > /dev/null 2>&1; then
        available="${available} ${package}"
        echo "included ${package}" >> "${work}/status"
      else
        echo "ERROR: ${package} is not available for Ubuntu 24.04"
        echo "missing ${package}" >> "${work}/status"
        failed=$((failed + 1))
      fi
    done

    # shellcheck disable=SC2086
    closure="$(apt-get install -s --no-install-recommends -o Dir::State::status=/dev/null ${available} ${local_debs} 2> /dev/null | sed -n 's/^Inst \([^ ]*\) (\([^ ]*\) .*/\1=\2/p')"
    if [ -z "${closure}" ]; then
      echo "ERROR: dependency resolution produced no packages"
      exit 1
    fi

    for spec in ${closure}; do
      name="${spec%%=*}"
      version="${spec#*=}"
      case " ${local_names} " in
        *" ${name} "*) continue ;;
      esac
      encoded="$(printf '%s' "${version}" | sed 's/:/%3a/g')"
      echo "${name}_${encoded}" >> "${work}/keep"
      ls "${pool}/${name}_${encoded}_"*.deb > /dev/null 2>&1 || echo "${name}=${version}" >> "${work}/need"
    done

    echo "$(wc -l < "${work}/need") package(s) to download"
    if [ -s "${work}/need" ]; then
      (cd "${work}/dl" && xargs -n 40 apt-get download -qq -o APT::Sandbox::User=root < "${work}/need") || failed=$((failed + 1))
      find "${work}/dl" -name '*.deb' -exec mv -f {} "${pool}/" \;
    fi

    for deb in "${pool}"/*.deb; do
      [ -e "${deb}" ] || continue
      grep -qxF "$(key_of "${deb}")" "${work}/keep" || { echo "Removing superseded ${deb##*/}"; rm -f "${deb}"; }
    done

    cd "${dest}" || exit 1
    apt-ftparchive packages pool > Packages.new
    mv -f Packages.new Packages
    gzip -9kf Packages
    apt-ftparchive release . > Release.new
    mv -f Release.new Release

    {
      echo "Ubuntu 24.04 package mirror, rebuilt $(date -u +%FT%TZ)"
      echo
      echo "Add to /etc/apt/sources.list.d/nomad.list:"
      echo "  deb [trusted=yes] http://<nomad-host>/files/linux/debs ./"
      echo
      sort "${work}/status"
    } > README.txt

    rm -rf "${work}"
    echo "Mirror contains $(ls "${pool}" | wc -l) packages"
    [ "${failed}" -eq 0 ]
  mirror-pacman.sh: |
    #!/bin/sh
    set -u
    umask 022

    dest="${MIRROR_DEST:-/mirror}"
    repo="${dest}/x86_64"
    db=/tmp/pacman-db
    packages="${PACMAN_PACKAGES:-firefox gnome-terminal ghostty meshtasticd kiwix-desktop python python-pip go gcc gdb make vim helix msedit socat}"
    failed=0

    mkdir -p "${repo}" "${db}/local"
    pacman --dbpath "${db}" -Sy --noconfirm > /dev/null || exit 1

    : > /tmp/status
    available=""
    for package in ${packages}; do
      if pacman --dbpath "${db}" -Si "${package}" > /dev/null 2>&1; then
        available="${available} ${package}"
        echo "included ${package}" >> /tmp/status
      else
        echo "ERROR: ${package} is not in the official Arch repositories"
        echo "missing ${package}" >> /tmp/status
        failed=$((failed + 1))
      fi
    done

    # shellcheck disable=SC2086
    pacman --dbpath "${db}" -Sp --noconfirm ${available} 2> /dev/null | sed 's#.*/##' | sort -u > /tmp/wanted
    if [ ! -s /tmp/wanted ]; then
      echo "ERROR: dependency resolution produced no packages"
      exit 1
    fi

    # shellcheck disable=SC2086
    pacman --dbpath "${db}" --cachedir "${repo}" -Sw --noconfirm ${available} || failed=$((failed + 1))

    for package_file in "${repo}"/*.pkg.tar.*; do
      [ -e "${package_file}" ] || continue
      name="${package_file##*/}"
      grep -qxF "${name%.sig}" /tmp/wanted || { echo "Removing superseded ${name}"; rm -f "${package_file}"; }
    done

    rm -f "${repo}"/nomad.db* "${repo}"/nomad.files*
    repo-add --quiet "${repo}/nomad.db.tar.gz" "${repo}"/*.pkg.tar.zst || exit 1

    {
      echo "Arch Linux package mirror, rebuilt $(date -u +%FT%TZ)"
      echo
      echo "Add to /etc/pacman.conf:"
      echo "  [nomad]"
      echo "  SigLevel = Optional TrustAll"
      echo "  Server = http://<nomad-host>/files/linux/pacman/\$arch"
      echo
      sort /tmp/status
    } > "${dest}/README.txt"

    echo "Mirror contains $(ls "${repo}"/*.pkg.tar.zst | wc -l) packages"
    [ "${failed}" -eq 0 ]
  sync-images.sh: |
    #!/bin/sh
    registry="${REGISTRY:-127.0.0.1:5000}"
    images_file="${IMAGES_FILE:-/etc/nomad/images.txt}"
    failed=0

    while read -r source; do
      case "${source}" in
        "" | "#"*) continue ;;
      esac

      name="${source#docker.io/}"
      name="${name#library/}"
      echo "Syncing ${source} -> ${registry}/${name}"
      if ! skopeo copy --quiet --retry-times 3 --dest-tls-verify=false "docker://${source}" "docker://${registry}/${name}" < /dev/null; then
        echo "ERROR: failed to sync ${source}"
        failed=$((failed + 1))
      fi
    done < "${images_file}"

    if [ "${failed}" -gt 0 ]; then
      echo "${failed} image(s) failed to sync"
      exit 1
    fi
    echo "All images are synced"
---
apiVersion: v1
kind: Service
metadata:
  name: nomad
  namespace: nomad
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "nomad"
    tailscale.com/tags: "tag:http"
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    app: nomad
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nomad
  namespace: nomad
  labels:
    app: nomad
spec:
  replicas: 1
  progressDeadlineSeconds: 86400
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nomad
  template:
    metadata:
      labels:
        app: nomad
      annotations:
        checksum/config: 4a1736bc28aeaf6b130ae4821cf5de4cfcea08eaa2a3d171098b14ca95b8a3dd
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab
      containers:
      - name: dashboard
        image: docker.io/library/caddy:2.11.9-alpine
        command: ["caddy", "run", "--config", "/etc/nomad/dashboard.Caddyfile", "--adapter", "caddyfile"]
        ports:
        - name: http
          containerPort: 80
          hostPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        resources:
          requests:
            cpu: 1m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: dashboard
          mountPath: /data
        - name: scripts
          mountPath: /etc/nomad
          readOnly: true
        - name: dashboard-www
          mountPath: /srv/www
          readOnly: true
      - name: kiwix-serve
        image: ghcr.io/kiwix/kiwix-serve:3.8.2
        command: ["/bin/sh", "/etc/nomad/kiwix-serve.sh"]
        securityContext:
          runAsUser: 0
        resources:
          requests:
            cpu: 1m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        volumeMounts:
        - name: kiwix-serve
          mountPath: /data
        - name: zims
          mountPath: /zims
          readOnly: true
        - name: scripts
          mountPath: /etc/nomad
          readOnly: true
      - name: maps
        image: docker.io/library/python:3.15.2-alpine
        command: ["python", "/etc/nomad/maps-server.py"]
        env:
        - name: DATA_DIR
          value: /data
        - name: APP_DIR
          value: /etc/nomad
        - name: PORT
          value: "8082"
        readinessProbe:
          httpGet:
            path: /api/regions
            port: 8082
          periodSeconds: 10
        resources:
          requests:
            cpu: 1m
            memory: 128Mi
          limits:
            cpu: 2000m
            memory: 1Gi
        volumeMounts:
        - name: maps
          mountPath: /data
        - name: scripts
          mountPath: /etc/nomad
          readOnly: true
      - name: notes
        image: ghcr.io/silverbulletmd/silverbullet:2.12.1
        env:
        - name: SB_URL_PREFIX
          value: /notes
        - name: SB_PORT
          value: "8083"
        resources:
          requests:
            cpu: 1m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 1Gi
        volumeMounts:
        - name: notes
          mountPath: /data
      - name: meshtastic-web
        image: ghcr.io/meshtastic/web:2.7.2
        command: ["/bin/sh", "/etc/nomad/meshtastic-web.sh"]
        securityContext:
          runAsUser: 0
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 10
        resources:
          requests:
            cpu: 1m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: meshtastic-web
          mountPath: /data
        - name: scripts
          mountPath: /etc/nomad
          readOnly: true
      - name: files
        image: docker.io/library/caddy:2.11.9-alpine
        command: ["caddy", "run", "--config", "/etc/nomad/files.Caddyfile", "--adapter", "caddyfile"]
        resources:
          requests:
            cpu: 1m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: files
          mountPath: /srv
          readOnly: true
        - name: android
          mountPath: /srv/android
          readOnly: true
        - name: maps
          mountPath: /srv/maps
          subPath: regions
          readOnly: true
        - name: scripts
          mountPath: /etc/nomad
          readOnly: true
      - name: docker
        image: docker.io/library/registry:2.8.3
        ports:
        - name: registry
          containerPort: 5000
        env:
        - name: REGISTRY_HTTP_ADDR
          value: 0.0.0.0:5000
        - name: REGISTRY_HTTP_RELATIVEURLS
          value: "true"
        - name: REGISTRY_STORAGE_DELETE_ENABLED
          value: "true"
        startupProbe:
          httpGet:
            path: /v2/
            port: registry
          periodSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /v2/
            port: registry
          periodSeconds: 10
        resources:
          requests:
            cpu: 1m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        volumeMounts:
        - name: docker
          mountPath: /var/lib/registry
      - name: maps-init
        image: docker.io/curlimages/curl:8.23.0
        command: ["/bin/sh", "-c", "while :; do /bin/sh /etc/nomad/maps-init.sh; sleep 3600; done"]
        env:
        - name: PMTILES_VERSION
          value: "1.31.2"
        - name: PMTILES_JS_VERSION
          value: "4.5.0"
        - name: MAPLIBRE_VERSION
          value: "5.24.0"
        - name: BASEMAPS_VERSION
          value: "5.7.2"
        securityContext:
          runAsUser: 0
        resources:
          requests:
            cpu: 1m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: maps
          mountPath: /data
        - name: scripts
          mountPath: /etc/nomad
          readOnly: true
      - name: docker-seed
        image: quay.io/skopeo/stable:v1.22.3
        command: ["/bin/sh", "-c", "until /bin/sh /etc/nomad/sync-images.sh; do sleep 300; done; exec sleep infinity"]
        env:
        - name: REGISTRY
          value: 127.0.0.1:5000
        securityContext:
          runAsUser: 0
        resources:
          requests:
            cpu: 1m
            memory: 128Mi
          limits:
            cpu: 2000m
            memory: 1Gi
        volumeMounts:
        - name: scripts
          mountPath: /etc/nomad
          readOnly: true
      - name: files-init
        image: docker.io/curlimages/curl:8.23.0
        command: ["/bin/sh", "-c", "while :; do /bin/sh /etc/nomad/files-init.sh; sleep 21600; done"]
        env:
        - name: FILES_ROOT
          value: /srv
        - name: NIXOS_CHANNEL
          value: "nixos-26.05"
        securityContext:
          runAsUser: 0
        resources:
          requests:
            cpu: 1m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        volumeMounts:
        - name: files
          mountPath: /srv
        - name: scripts
          mountPath: /etc/nomad
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: nomad-scripts
      - name: dashboard-www
        configMap:
          name: nomad-dashboard
      - name: dashboard
        hostPath:
          path: /media/services_pool/nomad/containers/dashboard
          type: DirectoryOrCreate
      - name: kiwix-serve
        hostPath:
          path: /media/services_pool/nomad/containers/kiwix-serve
          type: DirectoryOrCreate
      - name: maps
        hostPath:
          path: /media/services_pool/nomad/containers/maps
          type: DirectoryOrCreate
      - name: notes
        hostPath:
          path: /media/services_pool/nomad/containers/notes
          type: DirectoryOrCreate
      - name: meshtastic-web
        hostPath:
          path: /media/services_pool/nomad/containers/meshtastic-web
          type: DirectoryOrCreate
      - name: files
        hostPath:
          path: /media/services_pool/nomad/containers/files
          type: DirectoryOrCreate
      - name: docker
        hostPath:
          path: /media/services_pool/nomad/containers/docker
          type: DirectoryOrCreate
      - name: zims
        hostPath:
          path: /media/services_pool/kiwix
          type: DirectoryOrCreate
      - name: android
        hostPath:
          path: /media/services_pool/kiwix/android
          type: DirectoryOrCreate
