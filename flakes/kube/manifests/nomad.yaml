  namespace: nomad
spec:
  schedule: "0 4 * * 0"
  timeZone: "America/Denver"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 43200
      template:
        metadata:
          labels:
            app: nomad-image-sync
        spec:
          restartPolicy: OnFailure
          containers:
          - name: skopeo
            image: quay.io/skopeo/stable:v1.22.3
            command: ["/bin/sh", "/etc/nomad/sync-images.sh"]
            env:
            - name: REGISTRY
              value: nomad.nomad.svc.cluster.local:80
            securityContext:
              runAsUser: 0
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 2000m
                memory: 1Gi
            volumeMounts:
            - name: scripts
              mountPath: /etc/nomad
              readOnly: true
          volumes:
          - name: scripts
            configMap:
              name: nomad-scripts
