---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nomad-dashboard
  namespace: nomad
data:
  docker.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nomad registry</title>
    <style>
      :root { color-scheme: dark; --bg: #0b1016; --card: #151d27; --line: #243140; --text: #e6edf3; --muted: #8b9bab; --accent: #4ea1ff; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
      main { max-width: 860px; margin: 0 auto; padding: 40px 20px; }
      a { color: var(--accent); }
      h1 { margin: 0 0 4px; }
      .muted { color: var(--muted); }
      pre, code { background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
      pre { padding: 12px 14px; overflow-x: auto; }
      code { padding: 1px 6px; }
      pre code { border: 0; padding: 0; }
      ul { list-style: none; padding: 0; }
      li { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
      h3 { margin: 16px 0 8px; font-size: 15px; }
      summary { cursor: pointer; margin-bottom: 8px; }
      .tags { color: var(--muted); font-size: 13px; }
    </style>
    </head>
    <body>
    <main>
      <p><a href="/">&larr; Nomad</a></p>
      <h1>Container registry</h1>
      <p class="muted">Unauthenticated, plain HTTP. Served under <code>/docker/images</code> (the bare <code>/</code> path also works). Mirrors the images Nomad runs plus common base images and languages.</p>
      <h2>Pull</h2>
      <pre><code id="example"></code></pre>
      <p class="muted">Docker only trusts plain HTTP for hosts listed under <code>insecure-registries</code> in <code>/etc/docker/daemon.json</code>.</p>
      <details>
        <summary>Configure plaintext HTTP</summary>
        <h3>Rootful Docker</h3>
        <pre><code id="daemon"></code></pre>
        <p class="muted">Add the entry to <code>/etc/docker/daemon.json</code>, merging with any existing keys, then restart Docker with <code>sudo systemctl restart docker</code>. On NixOS, set <code>virtualisation.docker.daemon.settings.insecure-registries</code> instead.</p>
        <h3>Rootless Docker</h3>
        <pre><code id="rootless"></code></pre>
        <p class="muted">Add the entry to <code>~/.config/docker/daemon.json</code>, merging with any existing keys, then restart Docker with <code>systemctl --user restart docker</code>. On NixOS the rootless service starts <code>dockerd-rootless</code> with a generated <code>--config-file</code>, so that file is ignored: set <code>virtualisation.docker.rootless.daemon.settings.insecure-registries</code> and rebuild instead.</p>
        <p class="muted">Confirm the daemon picked it up with <code>docker info | grep -A3 "Insecure Registries"</code>. Docker tries HTTPS first and falls back to HTTP only for hosts listed there.</p>
        <h3>No Docker configuration</h3>
        <pre><code id="loopback"></code></pre>
        <p class="muted">Docker always trusts plain HTTP on <code>127.0.0.0/8</code>, so forward a local port to the registry instead of editing any daemon config. The image keeps the <code>localhost:5000</code> name unless you <code>docker tag</code> it.</p>
      </details>
      <h2>Repositories</h2>
      <ul id="repos"><li class="muted">Loading</li></ul>
    </main>
    <script>
    const host = location.host;
    document.getElementById('example').textContent = 'docker pull ' + host + '/docker/images/ubuntu:24.04\ndocker pull ' + host + '/docker/images/alpine:latest';
    const daemonConfig = JSON.stringify({ 'insecure-registries': [host] }, null, 2);
    document.getElementById('daemon').textContent = daemonConfig;
    document.getElementById('rootless').textContent = daemonConfig;
    const scheme = location.protocol === 'https:' ? 'OPENSSL' : 'TCP';
    const port = location.port || (location.protocol === 'https:' ? '443' : '80');
    document.getElementById('loopback').textContent = 'socat TCP-LISTEN:5000,bind=127.0.0.1,fork,reuseaddr ' + scheme + ':' + location.hostname + ':' + port + ' &\ndocker pull localhost:5000/docker/images/ubuntu:24.04';

    fetch('/v2/_catalog?n=1000', { cache: 'no-store' }).then(r => r.json()).then(async catalog => {
      const list = document.getElementById('repos');
      list.innerHTML = '';
      for (const repo of catalog.repositories) {
        const item = document.createElement('li');
        item.innerHTML = '<strong>' + repo + '</strong> <span class="tags">...</span>';
        list.appendChild(item);
        fetch('/v2/' + repo + '/tags/list', { cache: 'no-store' }).then(r => r.json()).then(t => {
          item.querySelector('.tags').textContent = (t.tags || []).join(', ');
        });
      }
      if (!catalog.repositories.length) list.innerHTML = '<li class="muted">No images yet. The initial pull may still be running.</li>';
    }).catch(() => {
      document.getElementById('repos').innerHTML = '<li class="muted">Registry unreachable</li>';
    });
    </script>
    </body>
    </html>
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nomad</title>
    <style>
      :root { color-scheme: dark; --bg: #0b1016; --card: #151d27; --line: #243140; --text: #e6edf3; --muted: #8b9bab; --accent: #4ea1ff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #14202e, var(--bg) 60%); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
      main { max-width: 1040px; margin: 0 auto; padding: 48px 20px; }
      h1 { margin: 0; font-size: 32px; letter-spacing: .02em; }
      .sub { color: var(--muted); margin: 4px 0 32px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
      a.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; color: inherit; text-decoration: none; transition: transform .12s, border-color .12s; }
      a.card:hover { transform: translateY(-2px); border-color: var(--accent); }
      .head { display: flex; align-items: center; justify-content: space-between; }
      .name { font-size: 18px; font-weight: 600; }
      .icon { font-size: 28px; }
      .desc { color: var(--muted); margin: 6px 0 14px; min-height: 44px; }
      .meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #6e7681; }
      .dot.up { background: #3fb950; }
      .dot.down { background: #f85149; }
      .dot.wait { background: #d29922; }
      footer { margin-top: 32px; color: var(--muted); font-size: 13px; }
      code { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
    </style>
    </head>
    <body>
    <main>
      <h1>Nomad</h1>
      <p class="sub">Offline knowledge, maps, notes, mesh radio, files and containers</p>
      <div class="grid" id="grid"></div>
      <footer>Serving from <code id="host"></code></footer>
    </main>
    <script>
    const apps = [
      { name: 'Kiwix', icon: '📚', path: '/kiwix/', desc: 'Offline Wikipedia and other ZIM libraries.', probe: '/kiwix/catalog/v2/entries?count=1',
        summary: text => { const m = text.match(/<totalResults>(\d+)</); return m ? m[1] + ' libraries' : 'online'; } },
      { name: 'Maps', icon: '🗺️', path: '/maps/', desc: 'Download OpenStreetMap areas for offline use.', probe: '/maps/api/regions',
        summary: text => { const regions = JSON.parse(text); const n = regions.filter(r => r.name !== 'world').length; return regions.some(r => r.name === 'world') ? n + ' areas installed' : 'base map downloading'; } },
      { name: 'Notes', icon: '📝', path: '/notes/', desc: 'SilverBullet notes and wiki.', probe: '/notes/.ping', ok: status => status < 500 },
      { name: 'Meshtastic', icon: '📡', path: '/meshtastic/', desc: 'Meshtastic web client for mesh radios.', probe: '/meshtastic/', ok: status => status < 500 },
      { name: 'Files', icon: '🗂️', path: '/files/', desc: 'Android APKs, Linux ISOs, AppImages, package mirrors and offline maps.', probe: '/files/', ok: status => status < 500 },
      { name: 'Docker', icon: '🐳', path: '/docker/', desc: 'Unauthenticated HTTP container registry.', probe: '/v2/_catalog',
        summary: text => JSON.parse(text).repositories.length + ' repositories' }
    ];

    const grid = document.getElementById('grid');
    document.getElementById('host').textContent = location.host;

    apps.forEach(app => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = app.path;
      card.innerHTML = '<div class="head"><span class="name">' + app.name + '</span><span class="icon">' + app.icon + '</span></div>' +
        '<div class="desc">' + app.desc + '</div><div class="meta"><span class="dot"></span><span class="state">checking</span></div>';
      grid.appendChild(card);

      const setState = (kind, label) => {
        const dot = card.querySelector('.dot');
        dot.classList.remove('up', 'down', 'wait');
        dot.classList.add(kind);
        card.querySelector('.state').textContent = label;
      };

      const check = () => fetch(app.probe, { cache: 'no-store' }).then(async response => {
        const up = app.ok ? app.ok(response.status) : response.ok;
        if (up) {
          let label = 'online';
          if (app.summary) {
            try { label = app.summary(await response.text()); } catch (e) { label = 'online'; }
          }
          setState('up', label);
        } else if ([502, 503, 504].includes(response.status)) {
          setState('wait', 'starting');
        } else {
          setState('down', 'unavailable');
        }
      }).catch(() => setState('down', 'unreachable'));

      check();
      setInterval(check, 10000);
    });
    </script>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nomad-scripts
  namespace: nomad
data:
  appimages.txt: |
    github pkgforge-dev/ghostty-appimage Ghostty-[0-9.]+-x86_64\.AppImage$
    github meshtastic/Meshtastic-Android Meshtastic_Desktop-[0-9.]+-x86_64\.AppImage$
    github kiwix/kiwix-js-pwa Kiwix-JS-Electron-[0-9.]+-E\.AppImage$
    github kiwix/kiwix-js-pwa Wikivoyage-by-Kiwix-[0-9.]+-E\.AppImage$
    url https://download.kiwix.org/release/kiwix-desktop/kiwix-desktop_x86_64.appimage kiwix-desktop-x86_64.AppImage
  dashboard.Caddyfile: |
    {
    	auto_https off
    	admin off
    }

    :80 {
    	@kiwix path /kiwix /kiwix/*
    	@notes path /notes /notes/*
    	@v2 path /v2 /v2/*

    	redir /maps /maps/ 308
    	redir /meshtastic /meshtastic/ 308
    	redir /files /files/ 308
    	redir /docker /docker/ 308

    	handle /healthz {
    		respond "ok" 200
    	}

    	handle @kiwix {
    		reverse_proxy 127.0.0.1:8081
    	}

    	handle @notes {
    		reverse_proxy 127.0.0.1:8083
    	}

    	handle @v2 {
    		uri replace /v2/docker/images/ /v2/ 1
    		reverse_proxy 127.0.0.1:5000 {
    			flush_interval -1
    		}
    	}

    	handle_path /maps/* {
    		reverse_proxy 127.0.0.1:8082
    	}

    	handle_path /meshtastic/* {
    		reverse_proxy 127.0.0.1:8080
    	}

    	handle /files/* {
    		reverse_proxy 127.0.0.1:8084
    	}

    	handle_path /docker/* {
    		@index path /
    		handle @index {
    			rewrite * /docker.html
    			root * /srv/www
    			file_server
    		}
    		handle {
    			reverse_proxy 127.0.0.1:5000 {
    				flush_interval -1
    			}
    		}
    	}

    	handle {
    		root * /srv/www
    		file_server
    	}
    }
  files-init.sh: |
    #!/bin/sh
    umask 022
    . /etc/nomad/lib.sh

    root="${FILES_ROOT:-/srv}"
    linux="${root}/linux"
    appimages_file="${APPIMAGES_FILE:-/etc/nomad/appimages.txt}"
    nixos_channel="${NIXOS_CHANNEL:-nixos-26.05}"
    failed=0

    mkdir -p "${root}/android" "${linux}/appimages" "${linux}/debs" "${linux}/apk" "${linux}/pacman"

    fetch_iso() {
      name="$1"
      url="$2"
      sha="$3"
      pattern="$4"
      dest="${linux}/${name}"

      if [ -s "${dest}" ]; then
        echo "Up to date: ${name}"
        return 0
      fi

      echo "Downloading ${name}"
      if ! download "${url}" "${dest}"; then
        echo "ERROR: failed to download ${url}"
        failed=$((failed + 1))
        return 1
      fi

      actual="$(sha256sum "${dest}" | cut -d' ' -f1)"
      if [ -n "${sha}" ] && [ "${actual}" != "${sha}" ]; then
        echo "ERROR: checksum mismatch for ${name}"
        rm -f "${dest}"
        failed=$((failed + 1))
        return 1
      fi

      for old in "${linux}"/${pattern}; do
        [ -e "${old}" ] && [ "${old}" != "${dest}" ] && rm -f "${old}"
      done
      return 0
    }

    ubuntu() {
      base="https://releases.ubuntu.com/24.04"
      entry="$(curl -fsSL --retry 3 "${base}/SHA256SUMS" | awk '$2 ~ /desktop-amd64\.iso$/ { sub(/^\*/, "", $2); print $2, $1 }' | sort -V | tail -1)"
      [ -n "${entry}" ] || { echo "ERROR: could not resolve Ubuntu 24.04 ISO"; failed=$((failed + 1)); return; }
      fetch_iso "${entry% *}" "${base}/${entry% *}" "${entry#* }" "ubuntu-24.04*-desktop-amd64.iso"
    }

    nixos() {
      url="$(curl -fsSIL --retry 3 -o /dev/null -w '%{url_effective}' "https://channels.nixos.org/${nixos_channel}/latest-nixos-graphical-x86_64-linux.iso")"
      name="${url##*/}"
      case "${name}" in
        nixos-graphical-*-x86_64-linux.iso) ;;
        *) echo "ERROR: could not resolve NixOS ISO (${url})"; failed=$((failed + 1)); return ;;
      esac
      sha="$(curl -fsSL --retry 3 "${url}.sha256" | cut -d' ' -f1)"
      fetch_iso "${name}" "${url}" "${sha}" "nixos-graphical-*-x86_64-linux.iso"
    }

    arch() {
      base="https://geo.mirror.pkgbuild.com/iso/latest"
      entry="$(curl -fsSL --retry 3 "${base}/sha256sums.txt" | awk '$2 ~ /^archlinux-[0-9.]+-x86_64\.iso$/ { print $2, $1 }' | sort -V | tail -1)"
      [ -n "${entry}" ] || { echo "ERROR: could not resolve Arch Linux ISO"; failed=$((failed + 1)); return; }
      fetch_iso "${entry% *}" "${base}/${entry% *}" "${entry#* }" "archlinux-*-x86_64.iso"
    }

    alpine() {
      base="https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64"
      name="$(curl -fsSL --retry 3 "${base}/" | grep -o 'alpine-standard-[0-9.]*-x86_64\.iso' | sort -uV | tail -1)"
      [ -n "${name}" ] || { echo "ERROR: could not resolve Alpine Linux ISO"; failed=$((failed + 1)); return; }
      sha="$(curl -fsSL --retry 3 "${base}/${name}.sha256" | cut -d' ' -f1)"
      fetch_iso "${name}" "${base}/${name}" "${sha}" "alpine-standard-*-x86_64.iso"
    }

    appimages() {
      dest_dir="${linux}/appimages"
      while read -r kind source pattern; do
        case "${kind}" in
          "" | "#"*) continue ;;
        esac

        case "${kind}" in
          github)
            url="$(gh_asset_url "${source}" "${pattern}")"
            file="${url##*/}"
            ;;
          url)
            url="${source}"
            file="${pattern}"
            ;;
          *)
            echo "ERROR: unknown source kind ${kind}"
            failed=$((failed + 1))
            continue
            ;;
        esac

        if [ -z "${url}" ]; then
          echo "ERROR: no release asset for ${source} ${pattern}"
          failed=$((failed + 1))
          continue
        fi

        size="$(remote_size "${url}" | tr -d ' ')"
        dest="${dest_dir}/${file}"
        if [ -n "${size}" ] && [ -f "${dest}" ] && [ "$(wc -c < "${dest}")" = "${size}" ]; then
          echo "Up to date: ${file}"
          continue
        fi

        echo "Downloading ${file}"
        if download "${url}" "${dest}"; then
          chmod 755 "${dest}"
          if [ "${kind}" = github ]; then
            for old in "${dest_dir}"/*; do
              [ "${old}" != "${dest}" ] && printf '%s\n' "${old##*/}" | grep -Eq "${pattern}" && rm -f "${old}"
            done
          fi
        else
          echo "ERROR: failed to download ${url}"
          failed=$((failed + 1))
        fi
      done < "${appimages_file}"
    }

    ubuntu
    nixos
    arch
    alpine
    appimages

    if [ "${failed}" -gt 0 ]; then
      echo "${failed} download(s) failed; restart the pod to retry"
    fi
    exit 0
  files.Caddyfile: |
    {
    	auto_https off
    	admin off
    }

    :8084 {
    	handle_path /files/* {
    		root * /srv
    		file_server browse {
    			hide *.part
    		}
    	}
    }
  images.txt: |
    docker.io/ubuntu:24.04
    docker.io/ubuntu:26.04
    docker.io/debian:trixie-slim
    docker.io/alpine:latest
    docker.io/alpine:3.24
    docker.io/archlinux:latest
    docker.io/busybox:latest
    docker.io/python:3-slim
    docker.io/python:3-alpine
    docker.io/golang:1-alpine
    docker.io/golang:1
    docker.io/node:lts-alpine
    docker.io/node:lts-slim
    docker.io/rust:1-slim
    docker.io/gcc:latest
    docker.io/nginx:alpine
    docker.io/caddy:alpine
    docker.io/redis:alpine
    docker.io/postgres:alpine
    docker.io/library/alpine:3.24.4
    docker.io/library/archlinux:base-20261108.0.623074
    docker.io/library/caddy:2.11.9-alpine
    docker.io/curlimages/curl:8.23.0
    ghcr.io/kiwix/kiwix-serve:3.8.2
    ghcr.io/meshtastic/web:2.7.2
    docker.io/library/python:3.15.2-alpine
    docker.io/library/registry:2.8.3
    ghcr.io/silverbulletmd/silverbullet:2.12.1
    quay.io/skopeo/stable:v1.22.3
    docker.io/library/ubuntu:24.04
  kiwix-serve.sh: |
    #!/bin/sh
    set -eu

    library=/data/library.xml
    port="${KIWIX_PORT:-8081}"

    rebuild() {
      tmp="$(mktemp /data/.library.XXXXXX)"
      rm -f "${tmp}"
      find /zims -name '*.zim' -type f | sort | while read -r zim; do
        kiwix-manage "${tmp}" add "${zim}" > /dev/null 2>&1 || echo "skipping unreadable ${zim}" >&2
      done
      if [ ! -f "${tmp}" ]; then
        printf '<?xml version="1.0" encoding="UTF-8"?>\n<library version="20110515"></library>\n' > "${tmp}"
      fi
      if cmp -s "${tmp}" "${library}" 2> /dev/null; then
        rm -f "${tmp}"
      else
        mv "${tmp}" "${library}"
      fi
    }

    rebuild

    (
      while sleep 600; do
        rebuild || true
      done
    ) &

    exec kiwix-serve --port="${port}" --urlRootLocation=/kiwix --monitorLibrary --library "${library}"
  lib.sh: |
    #!/bin/sh

    gh_asset_url() {
      curl -fsSL --retry 3 --connect-timeout 30 "https://api.github.com/repos/$1/releases?per_page=30" \
        | grep -o '"browser_download_url": *"[^"]*"' \
        | cut -d'"' -f4 \
        | grep -E "$2" \
        | head -1
    }

    remote_size() {
      curl -fsSIL --retry 3 --connect-timeout 30 "$1" \
        | tr -d '\r' \
        | awk 'tolower($1) == "content-length:" { size = $2 } END { print size }'
    }

    download() {
      part="$2.part"
      curl -fL --no-progress-meter --show-error --retry 5 --retry-delay 15 --connect-timeout 30 \
        --speed-limit 1024 --speed-time 120 -C - -o "${part}" "$1" \
        || { rm -f "${part}"; curl -fL --no-progress-meter --show-error --retry 5 --retry-delay 15 --connect-timeout 30 \
          --speed-limit 1024 --speed-time 120 -o "${part}" "$1"; } \
        || { rm -f "${part}"; return 1; }
      mv -f "${part}" "$2"
    }
  maps-index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline Maps</title>
    <link rel="stylesheet" href="assets/maplibre-gl.css">
    <style>
      :root { color-scheme: dark; --bg: #0f1419; --panel: #172029; --line: #26323f; --text: #e6edf3; --muted: #8b9bab; --accent: #4ea1ff; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
      body { display: flex; }
      #panel { width: 340px; max-width: 45vw; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 16px; }
      #map { flex: 1; min-width: 0; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 8px; }
      a { color: var(--accent); }
      label { display: block; margin: 8px 0; color: var(--muted); }
      input, select { width: 100%; margin-top: 4px; padding: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; }
      button { padding: 8px 12px; background: var(--accent); color: #04121f; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
      button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
      button.danger { background: transparent; color: #ff7b72; border: 1px solid var(--line); padding: 4px 8px; }
      .row { display: flex; gap: 8px; margin-top: 10px; }
      .row > button { flex: 1; }
      .item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
      .item .title { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .muted { color: var(--muted); font-size: 12px; }
      .ok { color: #3fb950; } .bad { color: #ff7b72; }
      code { background: var(--bg); padding: 1px 4px; border-radius: 4px; }
      @media (max-width: 700px) { body { flex-direction: column-reverse; } #panel { width: 100%; max-width: none; max-height: 45vh; border-right: 0; border-top: 1px solid var(--line); } }
    </style>
    </head>
    <body>
    <aside id="panel">
      <h1>Offline maps</h1>
      <div class="muted">OpenStreetMap data via Protomaps. Pan and zoom the map to the area you want, then download that view for offline use.</div>
      <h2>Download current view</h2>
      <label>Name <input id="name" placeholder="denver" autocomplete="off"></label>
      <label>Detail (max zoom)
        <select id="zoom">
          <option value="10">10 - regional overview</option>
          <option value="12">12 - towns and main roads</option>
          <option value="14" selected>14 - streets</option>
          <option value="15">15 - maximum detail</option>
        </select>
      </label>
      <label id="manual" hidden>Area (west, south, east, north) <input id="bboxText" placeholder="-105.1, 39.6, -104.8, 39.9" autocomplete="off"></label>
      <div class="muted" id="bbox"></div>
      <div class="row">
        <button class="secondary" id="estimate">Estimate size</button>
        <button id="download">Download</button>
      </div>
      <div class="muted" id="message" style="margin-top:8px"></div>
      <h2>Downloads</h2>
      <div id="jobs" class="muted">None</div>
      <h2>Installed areas</h2>
      <div id="regions" class="muted">Loading</div>
