---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yattee-web
  namespace: "media"
  labels:
    app.kubernetes.io/name: yattee-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: yattee-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yattee-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: "homelab"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: yattee-web
          image: "ghcr.io/heywoodlh/yattee-web:0.1.0"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /session
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /session
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /session
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: "/media/data-ssd/yattee-web"
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: yattee-web
  namespace: "media"
  labels:
    app.kubernetes.io/name: yattee-web
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "yattee-web"
    tailscale.com/tags: "tag:http"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: yattee-web
