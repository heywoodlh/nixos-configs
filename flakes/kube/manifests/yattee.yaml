---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yattee
  namespace: default
  labels:
    app.kubernetes.io/name: yattee
    app.kubernetes.io/instance: yattee
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: yattee
      app.kubernetes.io/instance: yattee
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yattee
        app.kubernetes.io/instance: yattee
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab
      containers:
        - name: yattee
          image: "docker.io/yattee/yattee-server:1.0.9"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP
          env:
            - name: SECURE_COOKIES
              value: "false"
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: data
          hostPath:
            path: /media/data-ssd/yattee/data
            type: DirectoryOrCreate
        - name: downloads
          hostPath:
            path: /media/data-ssd/yattee/downloads
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: yattee
  namespace: default
  labels:
    app.kubernetes.io/name: yattee
    app.kubernetes.io/instance: yattee
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "youtube"
    tailscale.com/tags: "tag:http"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: yattee
    app.kubernetes.io/instance: yattee
