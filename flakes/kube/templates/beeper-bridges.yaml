---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  finalizers:
  - onepassword.com/finalizer.secret
  generation: 1
  name: beeper-key
  namespace: @namespace@
spec:
  itemPath: vaults/Kubernetes/items/ujxgo6q3j7k44nr4vgxgkh3zoi
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  finalizers:
  - onepassword.com/finalizer.secret
  generation: 1
  name: beeper-bluebubbles
  namespace: @namespace@
spec:
  itemPath: vaults/Kubernetes/items/ho6p75vydj7jxykh2i2kd45cta
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beeper-imessage-entrypoint
  namespace: @namespace@
data:
  run-bridge-imessage.sh: |
    #!/bin/bash
    set -euf -o pipefail
    if [[ -z "${BRIDGE_NAME:-}" ]]; then
        if [[ ! -z "$1" ]]; then
            export BRIDGE_NAME="$1"
        else
            echo "BRIDGE_NAME not set"
            exit 1
        fi
    fi
    export BBCTL_CONFIG=${BBCTL_CONFIG:-/tmp/bbctl.json}
    export BEEPER_ENV=${BEEPER_ENV:-prod}
    if [[ ! -f $BBCTL_CONFIG ]]; then
        if [[ -z "$MATRIX_ACCESS_TOKEN" ]]; then
            echo "MATRIX_ACCESS_TOKEN not set"
            exit 1
        fi
        export DATA_DIR=${DATA_DIR:-/data}
        if [[ ! -d $DATA_DIR ]]; then
            echo "DATA_DIR ($DATA_DIR) does not exist, creating"
            mkdir -p $DATA_DIR
        fi
        export DB_DIR=${DB_DIR:-/data/db}
        mkdir -p $DB_DIR
        jq -n '{environments: {"\(env.BEEPER_ENV)": {access_token: env.MATRIX_ACCESS_TOKEN, database_dir: env.DB_DIR, bridge_data_dir: env.DATA_DIR}}}' > $BBCTL_CONFIG
    fi
    bbctl -c /tmp/bbctl.json -e prod run --param 'imessage_platform=bluebubbles' --param "bluebubbles_url=$BLUEBUBBLES_URL" --param "bluebubbles_password=$BLUEBUBBLES_PASSWORD" sh-imessage-000
  resolv.conf: |
    nameserver 100.100.100.100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beeper-bridges
  namespace: @namespace@
  labels:
    app.kubernetes.io/name: beeper-bridges
    app.kubernetes.io/instance: beeper-bridges
spec:
  replicas: @replicas@
  selector:
    matchLabels:
      app.kubernetes.io/name: beeper-bridges
      app.kubernetes.io/instance: beeper-bridges
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beeper-bridges
        app.kubernetes.io/instance: beeper-bridges
    spec:
      securityContext:
        {}
      containers:
        - name: beeper-signal
          securityContext:
            {}
          image: "@image@"
          command:
            - "/bin/ash"
            - "-c"
          volumeMounts:
            - name: signal-config
              mountPath: /data
          args:
            - /usr/local/bin/run-bridge.sh sh-signal-000
          imagePullPolicy: IfNotPresent
          resources:
            {}
          env:
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beeper-key
                  key: password
        - name: beeper-discord
          securityContext:
            {}
          image: "@image@"
          command:
            - "/bin/ash"
            - "-c"
          volumeMounts:
            - name: discord-config
              mountPath: /data
          args:
            - /usr/local/bin/run-bridge.sh sh-discord-000
          imagePullPolicy: IfNotPresent
          resources:
            {}
          env:
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beeper-key
                  key: password
        # Set up by sending a DM to: `@sh-telegram-000bot:beeper.local`
        - name: beeper-telegram
          securityContext:
            {}
          image: "@image@"
          command:
            - "/bin/ash"
            - "-c"
          volumeMounts:
            - name: telegram-config
              mountPath: /data
          args:
            - /usr/local/bin/run-bridge.sh sh-telegram-000
          imagePullPolicy: IfNotPresent
          resources:
            {}
          env:
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beeper-key
                  key: password
        # Set up by sending a DM to: `@sh-googlemessages-000bot:beeper.local`
        - name: beeper-google-messages
          securityContext:
            {}
          image: "@image@"
          command:
            - "/bin/ash"
            - "-c"
          volumeMounts:
            - name: google-messages-config
              mountPath: /data
          args:
            - /usr/local/bin/run-bridge.sh sh-googlemessages-000
          imagePullPolicy: IfNotPresent
          resources:
            {}
          env:
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beeper-key
                  key: password
        # Set up by sending a DM to: `@sh-googlevoice-000bot:beeper.local`
        - name: beeper-google-voice
          securityContext:
            {}
          image: "@image@"
          command:
            - "/bin/ash"
            - "-c"
          volumeMounts:
            - name: google-voice-config
              mountPath: /data
          args:
            - /usr/local/bin/run-bridge.sh sh-googlevoice-000
          imagePullPolicy: IfNotPresent
          resources:
            {}
          env:
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beeper-key
                  key: password
        #- name: beeper-irc
        #  securityContext:
        #    {}
        #  image: "@image@"
        #  command:
        #    - "/bin/ash"
        #    - "-c"
        #  volumeMounts:
        #    - name: irc-config
        #      mountPath: /data
        #  args:
        #    - /usr/local/bin/run-bridge.sh sh-irc-000
        #  imagePullPolicy: IfNotPresent
        #  resources:
        #    {}
        #  env:
        #    - name: MATRIX_ACCESS_TOKEN
        #      valueFrom:
        #        secretKeyRef:
        #          name: beeper-key
        #          key: password
        # Set up by sending a DM to: `@sh-imessage-000bot:beeper.local`
        - name: beeper-imessage
          securityContext:
            {}
          image: "@image@"
          command:
            - "/bin/ash"
            - "-c"
          volumeMounts:
            - name: imessage-config
              mountPath: /data
            - name: imessage-entrypoint
              mountPath: /usr/local/bin/run-bridge-imessage.sh
              subPath: run-bridge-imessage.sh
            - name: imessage-entrypoint
              mountPath: /etc/resolv.conf
              subPath: resolv.conf
          args:
            - /usr/local/bin/run-bridge-imessage.sh sh-imessage-000
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beeper-key
                  key: password
            - name: BLUEBUBBLES_URL
              valueFrom:
                secretKeyRef:
                  name: beeper-bluebubbles
                  key: url
            - name: BLUEBUBBLES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: beeper-bluebubbles
                  key: password
      volumes:
      - name: signal-config
        hostPath:
          path: @hostfolder@/signal
          type: DirectoryOrCreate
      - name: discord-config
        hostPath:
          path: @hostfolder@/discord
          type: DirectoryOrCreate
      - name: telegram-config
        hostPath:
          path: @hostfolder@/telegram
          type: DirectoryOrCreate
      - name: irc-config
        hostPath:
          path: @hostfolder@/irc
          type: DirectoryOrCreate
      - name: google-messages-config
        hostPath:
          path: @hostfolder@/googlemessages
          type: DirectoryOrCreate
      - name: google-voice-config
        hostPath:
          path: @hostfolder@/googlevoice
          type: DirectoryOrCreate
      - name: imessage-config
        hostPath:
          path: @hostfolder@/imessage
          type: DirectoryOrCreate
      - name: imessage-entrypoint
        configMap:
          name: beeper-imessage-entrypoint
          items:
          - key: run-bridge-imessage.sh
            path: run-bridge-imessage.sh
            mode: 0755
          - key: resolv.conf
            path: resolv.conf
            mode: 0644
