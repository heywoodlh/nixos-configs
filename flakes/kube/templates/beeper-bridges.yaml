                  name: beeper-bluebubbles
                  key: password
      volumes:
      - name: signal-config
        hostPath:
          path: @hostfolder@/signal
          type: DirectoryOrCreate
      - name: discord-config
        hostPath:
          path: @hostfolder@/discord
          type: DirectoryOrCreate
      - name: telegram-config
