          path: @hostfolder@/googlevoice
          type: DirectoryOrCreate
      - name: imessage-config
        hostPath:
          path: @hostfolder@/imessage
          type: DirectoryOrCreate
      - name: imessage-entrypoint
        configMap:
          name: beeper-imessage-entrypoint
          items:
          - key: run-bridge-imessage.sh
            path: run-bridge-imessage.sh
            mode: 0755
          - key: resolv.conf
            path: resolv.conf
            mode: 0644
      - name: discord-entrypoint
        configMap:
          name: beeper-discord-entrypoint
          items:
          - key: run-bridge-discord.sh
            path: run-bridge-discord.sh
            mode: 0755
          - key: patch-discord-config.py
            path: patch-discord-config.py
            mode: 0644
