apiVersion: v1
kind: ConfigMap
metadata:
  name: beeper-imessage-entrypoint
  namespace: @namespace@
data:
  run-bridge-imessage.sh: |
    #!/bin/bash
    set -euf -o pipefail
    if [[ -z "${BRIDGE_NAME:-}" ]]; then
        if [[ ! -z "$1" ]]; then
            export BRIDGE_NAME="$1"
        else
            echo "BRIDGE_NAME not set"
            exit 1
        fi
    fi
    export BBCTL_CONFIG=${BBCTL_CONFIG:-/tmp/bbctl.json}
    export BEEPER_ENV=${BEEPER_ENV:-prod}
    if [[ ! -f $BBCTL_CONFIG ]]; then
        if [[ -z "$MATRIX_ACCESS_TOKEN" ]]; then
            echo "MATRIX_ACCESS_TOKEN not set"
            exit 1
        fi
        export DATA_DIR=${DATA_DIR:-/data}
        if [[ ! -d $DATA_DIR ]]; then
            echo "DATA_DIR ($DATA_DIR) does not exist, creating"
            mkdir -p $DATA_DIR
        fi
        export DB_DIR=${DB_DIR:-/data/db}
        mkdir -p $DB_DIR
        jq -n '{environments: {"\(env.BEEPER_ENV)": {access_token: env.MATRIX_ACCESS_TOKEN, database_dir: env.DB_DIR, bridge_data_dir: env.DATA_DIR}}}' > $BBCTL_CONFIG
    fi
    bbctl -c /tmp/bbctl.json -e prod run --param 'imessage_platform=bluebubbles' --param "bluebubbles_url=$BLUEBUBBLES_URL" --param "bluebubbles_password=$BLUEBUBBLES_PASSWORD" sh-imessage-000
  resolv.conf: |
    nameserver 100.100.100.100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beeper-discord-entrypoint
  namespace: @namespace@
data:
  run-bridge-discord.sh: |
    #!/bin/bash
    set -euf -o pipefail
    if [[ -z "${BRIDGE_NAME:-}" ]]; then
        if [[ ! -z "$1" ]]; then
            export BRIDGE_NAME="$1"
        else
            echo "BRIDGE_NAME not set"
            exit 1
        fi
    fi
    export BBCTL_CONFIG=${BBCTL_CONFIG:-/tmp/bbctl.json}
    export BEEPER_ENV=${BEEPER_ENV:-prod}
    if [[ ! -f $BBCTL_CONFIG ]]; then
        if [[ -z "$MATRIX_ACCESS_TOKEN" ]]; then
            echo "MATRIX_ACCESS_TOKEN not set"
            exit 1
        fi
        export DATA_DIR=${DATA_DIR:-/data}
        if [[ ! -d $DATA_DIR ]]; then
            echo "DATA_DIR ($DATA_DIR) does not exist, creating"
            mkdir -p $DATA_DIR
        fi
        export DB_DIR=${DB_DIR:-/data/db}
        mkdir -p $DB_DIR
        jq -n '{environments: {"\(env.BEEPER_ENV)": {access_token: env.MATRIX_ACCESS_TOKEN, database_dir: env.DB_DIR, bridge_data_dir: env.DATA_DIR}}}' > $BBCTL_CONFIG
    fi
    export DATA_DIR=${DATA_DIR:-/data}
    DISCORD_CONFIG="$DATA_DIR/$BRIDGE_NAME/config.yaml"
    mkdir -p "$DATA_DIR/$BRIDGE_NAME"
    bbctl -c "$BBCTL_CONFIG" -e "$BEEPER_ENV" config --type discord -o "$DISCORD_CONFIG" "$BRIDGE_NAME"
    python3 "$(dirname "$0")/patch-discord-config.py" "$DISCORD_CONFIG"
    bbctl -c "$BBCTL_CONFIG" -e "$BEEPER_ENV" run --no-override-config "$BRIDGE_NAME"
  patch-discord-config.py: |
    #!/usr/bin/env python3
    import sys
    from ruamel.yaml import YAML

    TEMPLATE = '{{if or (eq .Type 3) (eq .Type 4)}}{{.Name}}{{else if or (eq .GuildName "heywoodlh study server") (eq .GuildName "CULUG")}}#{{.Name}} ({{.GuildName}}){{else}}#{{.Name}}{{end}}'
    KEY = "channel_name_template:"

    def main(path):
        with open(path) as f:
            lines = f.readlines()

        in_bridge = False
        patched = False
        for i, line in enumerate(lines):
            if line.startswith("bridge:"):
                in_bridge = True
                continue
            if in_bridge and line.strip() and not line[0].isspace():
                break
            if in_bridge and line.lstrip().startswith(KEY):
                indent = line[: len(line) - len(line.lstrip())]
                lines[i] = f"{indent}{KEY} '{TEMPLATE}'\n"
                patched = True
                break

        if not patched:
            raise SystemExit(f"{path}: {KEY} not found under bridge")

        with open(path, "w") as f:
            f.writelines(lines)

        with open(path) as f:
            config = YAML(typ="safe").load(f)
        if config["bridge"]["channel_name_template"] != TEMPLATE:
            raise SystemExit(f"{path}: patched channel_name_template does not match")

    if __name__ == "__main__":
        if len(sys.argv) != 2:
            raise SystemExit(f"usage: {sys.argv[0]} CONFIG")
        main(sys.argv[1])
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beeper-bridges
  namespace: @namespace@
  labels:
    app.kubernetes.io/name: beeper-bridges
    app.kubernetes.io/instance: beeper-bridges
spec:
  replicas: @replicas@
  selector:
    matchLabels:
      app.kubernetes.io/name: beeper-bridges
      app.kubernetes.io/instance: beeper-bridges
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beeper-bridges
        app.kubernetes.io/instance: beeper-bridges
    spec:
      securityContext:
        {}
      containers:
        - name: beeper-signal
          securityContext:
            {}
          image: "@image@"
          command:
            - "/bin/ash"
            - "-c"
          volumeMounts:
            - name: signal-config
              mountPath: /data
          args:
            - /usr/local/bin/run-bridge.sh sh-signal-000
          imagePullPolicy: IfNotPresent
          resources:
            {}
          env:
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beeper-key
                  key: password
        - name: beeper-discord
          securityContext:
            {}
          image: "@image@"
          command:
            - "/bin/ash"
            - "-c"
          volumeMounts:
            - name: discord-config
              mountPath: /data
            - name: discord-entrypoint
              mountPath: /opt/beeper-discord
          args:
            - /opt/beeper-discord/run-bridge-discord.sh sh-discord-000
          imagePullPolicy: IfNotPresent
          resources:
            {}
          env:
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beeper-key
                  key: password
        # Set up by sending a DM to: `@sh-telegram-000bot:beeper.local`
        - name: beeper-telegram
          securityContext:
            {}
          image: "@image@"
          command:
            - "/bin/ash"
            - "-c"
          volumeMounts:
            - name: telegram-config
              mountPath: /data
          args:
            - /usr/local/bin/run-bridge.sh sh-telegram-000
          imagePullPolicy: IfNotPresent
          resources:
            {}
          env:
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beeper-key
                  key: password
        # Set up by sending a DM to: `@sh-googlemessages-000bot:beeper.local`
        - name: beeper-google-messages
          securityContext:
            {}
          image: "@image@"
          command:
            - "/bin/ash"
            - "-c"
          volumeMounts:
            - name: google-messages-config
              mountPath: /data
          args:
            - /usr/local/bin/run-bridge.sh sh-googlemessages-000
          imagePullPolicy: IfNotPresent
          resources:
            {}
          env:
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beeper-key
                  key: password
        # Set up by sending a DM to: `@sh-googlevoice-000bot:beeper.local`
        - name: beeper-google-voice
          securityContext:
            {}
          image: "@image@"
          command:
            - "/bin/ash"
            - "-c"
          volumeMounts:
            - name: google-voice-config
              mountPath: /data
          args:
            - /usr/local/bin/run-bridge.sh sh-googlevoice-000
          imagePullPolicy: IfNotPresent
          resources:
            {}
          env:
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beeper-key
                  key: password
        #- name: beeper-irc
        #  securityContext:
        #    {}
        #  image: "@image@"
        #  command:
        #    - "/bin/ash"
        #    - "-c"
        #  volumeMounts:
        #    - name: irc-config
        #      mountPath: /data
        #  args:
        #    - /usr/local/bin/run-bridge.sh sh-irc-000
        #  imagePullPolicy: IfNotPresent
        #  resources:
        #    {}
        #  env:
        #    - name: MATRIX_ACCESS_TOKEN
        #      valueFrom:
        #        secretKeyRef:
        #          name: beeper-key
        #          key: password
        # Set up by sending a DM to: `@sh-imessage-000bot:beeper.local`
        - name: beeper-imessage
          securityContext:
            {}
          image: "@image@"
          command:
            - "/bin/ash"
            - "-c"
          volumeMounts:
            - name: imessage-config
              mountPath: /data
            - name: imessage-entrypoint
              mountPath: /usr/local/bin/run-bridge-imessage.sh
              subPath: run-bridge-imessage.sh
            - name: imessage-entrypoint
              mountPath: /etc/resolv.conf
              subPath: resolv.conf
          args:
            - /usr/local/bin/run-bridge-imessage.sh sh-imessage-000
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beeper-key
                  key: password
            - name: BLUEBUBBLES_URL
              valueFrom:
                secretKeyRef:
                  name: beeper-bluebubbles
                  key: url
            - name: BLUEBUBBLES_PASSWORD
              valueFrom:
