---
apiVersion: v1
kind: Service
metadata:
  name: http-files
  namespace: @namespace@
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "files"
    tailscale.com/tags: "tag:http"
spec:
  selector:
    app: http-files
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-files
  namespace: @namespace@
spec:
  replicas: @replicas@
  selector:
    matchLabels:
      app: http-files
  template:
    metadata:
      labels:
        app: http-files
    spec:
      nodeSelector:
        kubernetes.io/hostname: @nodename@
      containers:
      - name: http-files
        image: @image@
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: http-files
          mountPath: /web
        - name: kiwix
          mountPath: /web/kiwix
          readOnly: true
      volumes:
      - name: http-files
        hostPath:
          path: /opt/files
      - name: kiwix
        hostPath:
          path: @kiwixfolder@
          type: DirectoryOrCreate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiwix-zim-urls
  namespace: @namespace@
data:
  zims.txt: |
@zim_urls@
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiwix-zim-downloader
  namespace: @namespace@
data:
  download.sh: |
@zim_download_script@
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kiwix-zim-downloader
  namespace: @namespace@
spec:
  schedule: "@kiwix_schedule@"
  timeZone: "America/Denver"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 172800
      template:
        metadata:
          labels:
            app: kiwix-zim-downloader
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: @nodename@
          containers:
          - name: downloader
            image: @curl_image@
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh", "/scripts/download.sh"]
            env:
            - name: ZIM_URLS_FILE
              value: /config/zims.txt
            - name: ZIM_DEST
              value: /kiwix
            securityContext:
              runAsUser: 0
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
            - name: urls
              mountPath: /config
              readOnly: true
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: kiwix
              mountPath: /kiwix
          volumes:
          - name: urls
            configMap:
              name: kiwix-zim-urls
          - name: script
            configMap:
              name: kiwix-zim-downloader
          - name: kiwix
            hostPath:
              path: @kiwixfolder@
              type: DirectoryOrCreate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiwix-apk-sources
  namespace: @namespace@
data:
  apks.txt: |
@apk_sources@
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiwix-apk-downloader
  namespace: @namespace@
data:
  download-apks.sh: |
@apk_download_script@
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kiwix-apk-downloader
  namespace: @namespace@
spec:
  schedule: "@apk_schedule@"
  timeZone: "America/Denver"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: kiwix-apk-downloader
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: @nodename@
          containers:
          - name: downloader
            image: @curl_image@
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh", "/scripts/download-apks.sh"]
            env:
            - name: APK_SOURCES_FILE
              value: /config/apks.txt
            - name: APK_DEST
              value: /kiwix/android
            securityContext:
              runAsUser: 0
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
            - name: sources
              mountPath: /config
              readOnly: true
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: kiwix
              mountPath: /kiwix
          volumes:
          - name: sources
            configMap:
              name: kiwix-apk-sources
          - name: script
            configMap:
              name: kiwix-apk-downloader
          - name: kiwix
            hostPath:
              path: @kiwixfolder@
              type: DirectoryOrCreate
