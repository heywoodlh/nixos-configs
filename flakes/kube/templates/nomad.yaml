---
apiVersion: v1
kind: Service
metadata:
  name: nomad
  namespace: @namespace@
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "nomad"
    tailscale.com/tags: "tag:http"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: nomad
  namespace: @namespace@
subsets:
- addresses:
  - ip: @host_ip@
  ports:
  - name: http
    port: 8080
    protocol: TCP
