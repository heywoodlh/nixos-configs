---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: "juabsd-forwarder-authkey"
  namespace: "@namespace@"
spec:
  itemPath: "vaults/Kubernetes/items/zprnv7qso3djtipop56uzoqwlm"
---
apiVersion: v1
kind: Secret
metadata:
  name: juabsd-forwarder-state
  namespace: "@namespace@"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: juabsd-forwarder
  namespace: "@namespace@"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # "namespace" omitted since ClusterRoles are not namespaced
  name: juabsd-forwarder
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "get", "list", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "get", "list", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: juabsd-forwarder
subjects:
- kind: ServiceAccount
  name: juabsd-forwarder
  namespace: "@namespace@"
roleRef:
  kind: ClusterRole
  name: juabsd-forwarder
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: juabsd-forwarder-forwards
  namespace: "@namespace@"
data:
  # his Caddy matches a site by Host, so the proxy sets it to the tailnet address
  Caddyfile: |
    {
      admin off
      auto_https off
    }

    :8017 {
      reverse_proxy 100.64.0.7:8017 {
        header_up Host 100.64.0.7
      }
    }

    :49820 {
      reverse_proxy 100.64.0.1:49820 {
        header_up Host 100.64.0.1
      }
    }

    :9090 {
      reverse_proxy http-files.default.svc.cluster.local:80
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juabsd-forwarder
  namespace: "@namespace@"
  labels:
    app: juabsd-forwarder
spec:
  replicas: @replicas@
  selector:
    matchLabels:
      app: juabsd-forwarder
  template:
    metadata:
      labels:
        app: juabsd-forwarder
      annotations:
        checksum/forwards: "@forwards_checksum@"
    spec:
      serviceAccountName: juabsd-forwarder
      securityContext:
        fsGroup: 65534
      containers:
      - name: tailscale
        image: "@image@"
        command: ["/bin/sh", "-c"]
        args:
        - |
          export TS_EXTRA_ARGS="--login-server=${TS_CONTROLLER}"
          exec /usr/local/bin/containerboot
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: juabsd-forwarder-authkey
              key: enrollment-key
        - name: TS_CONTROLLER
          valueFrom:
            secretKeyRef:
              name: juabsd-forwarder-authkey
              key: controller
        - name: TS_KUBE_SECRET
          value: juabsd-forwarder-state
        - name: TS_HOSTNAME
          value: juabsd-forwarder
        - name: TS_USERSPACE
          value: "false"
        - name: TS_ACCEPT_DNS
          value: "false"
        - name: TS_AUTH_ONCE
          value: "true"
        volumeMounts:
        - name: dev-net-tun
          mountPath: /dev/net/tun
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      - name: forwarder
        image: "@forwarder_image@"
        command: ["caddy"]
        args: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
        volumeMounts:
        - name: forwards
          mountPath: /etc/caddy
          readOnly: true
        - name: caddy-data
          mountPath: /data
        - name: caddy-config
          mountPath: /config
        - name: caddy-tmp
          mountPath: /tmp
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      - name: forwards
        configMap:
          name: juabsd-forwarder-forwards
      - name: caddy-data
        emptyDir: {}
      - name: caddy-config
        emptyDir: {}
      - name: caddy-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: juabsd-forwarder
  namespace: "@namespace@"
  labels:
    app: juabsd-forwarder
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "juabsd"
    tailscale.com/tags: "tag:juabsd"
spec:
  type: ClusterIP
  selector:
    app: juabsd-forwarder
  ports:
  - name: p8017
    port: 8017
    targetPort: 8017
    protocol: TCP
  - name: p49820-tcp
    port: 49820
    targetPort: 49820
    protocol: TCP
