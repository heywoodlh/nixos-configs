pre-commit:
  commands:
    nix-format:
      glob: "*.nix"
      run: alejandra --check {staged_files}
    nix-statix:
      glob: "*.nix"
      run: deadnix --fail {staged_files}
    shellcheck:
      glob: "*.sh"
      run: shellcheck --severity=error {staged_files}
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}
    yamllint:
      glob: "*.{yml,yaml}"
      run: yamllint -c .yamllint.yml {staged_files}
    check-dupe-inputs:
      run: |
        if grep -Riq '_2": {' flake.lock
        then
          echo duplicate inputs detected in flake.lock
          printf "useful commands for finding dupes:\ngrep -Ri '_2\": {' flake.lock\nnix flake metadata | strip-ansi\n"
          exit 1
        fi
    gen-docs:
      run: |
        nix build --accept-flake-config .#docs
        cp -f ./result docs/options.md
        git add ./docs/options.md
        git update-index --add ./docs/options.md
    gitleaks:
      run: |
        gitleaks protect --staged --verbose --redact
